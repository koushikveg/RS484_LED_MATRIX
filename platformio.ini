; PlatformIO build config. Arduino IDE users can ignore this file and open
; firmware/led_sign/led_sign.ino directly.

[platformio]
src_dir = firmware/led_sign
default_envs = esp32s3

; ESP32-S3 RS485/CAN board (Waveshare / KLAYERS) - the firmware's default pins
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Plain ESP32 dev board with a separate RS-485 module (change the pins in
; led_sign.ino to match)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
